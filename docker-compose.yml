services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai_secret
      POSTGRES_DB: nexusai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nexusai -d nexusai" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nexusai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nexusai:nexusai_secret@postgres:5432/nexusai
      GROQ_API_KEY: ${GROQ_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost"]'
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: nexusai-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
